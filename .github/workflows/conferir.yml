name: conferir

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Testes do verificador offline
        run: python3 -m unittest discover -s tests -v
      - name: Ferramentas fixadas
        run: python3 ferramentas/instalar_ci.py
      - name: Segredos
        run: gitleaks git . --config ferramentas/gitleaks.toml --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --redact --log-opts=--all
      - name: Workflows
        run: python3 ferramentas/conferir_workflows.py
